<div class="para logical">
<div class="para">Let a smooth surface <span class="process-math">\(Q\)</span> be parametrized by <span class="process-math">\(\vr(s,t)\)</span> over a domain <span class="process-math">\(D\text{.}\)</span> The total flux of a smooth vector field <span class="process-math">\(\vF\)</span> through <span class="process-math">\(Q\)</span> is given by</div>
<div class="displaymath process-math">

\iint_D \vF \cdot (\vr_s \times \vr_t)\, dA\text{.}
\end{equation*}
</div>
